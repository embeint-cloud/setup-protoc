name: 'Setup protoc'
description: 'Download protoc compiler and add it to the PATH'
author: 'Arduino'
inputs:
  version:
    description: 'Version to use. Example: 26.2'
    default: '26.x'
  include-pre-releases:
    description: 'Include github pre-releases in latest version calculation'
    default: 'false'
  repo-token:
    description: 'GitHub token used to authenticate requests to the GitHub API when listing protoc releases. Without it, requests are unauthenticated and subject to a much lower rate limit (60/hour per IP vs. 5000/hour). Recommended: pass the workflow GITHUB_TOKEN secret.'
    default: ''
outputs:
  version:
    description: 'Actual version of the protoc compiler environment that has been installed'
  path:
    description: 'Path to where the protoc compiler has been installed'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'box'
  color: 'green'
